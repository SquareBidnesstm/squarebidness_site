<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>QR</title>
  <meta name="description" content="Quick QR access for Mayor Timika Price — City of Colfax, Louisiana." />
  <meta name="robots" content="noindex,follow" />
  <meta name="theme-color" content="#1a3a6e" />
  <meta name="application-name" content="QR" />
  <meta name="apple-mobile-web-app-title" content="QR" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <link rel="canonical" href="https://www.squarebidness.com/colfax/mayor/qr/" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="apple-touch-icon" sizes="180x180" href="/colfax/mayor/qr/assets/apple-touch-icon.png" />
  <link rel="manifest" href="/colfax/mayor/qr/manifest.webmanifest" />

  <style>
    :root {
      --bg: #000;
      --line: #1e2d45;
      --text: #f0f4ff;
      --muted: #7a8aaa;
      --navy: #1a3a6e;
      --gold: #c9a227;
      --shadow: 0 24px 80px rgba(0,0,0,.6);
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: #000;
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Inter, Arial, sans-serif;
      overflow-x: hidden;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: calc(14px + env(safe-area-inset-top)) 14px calc(14px + env(safe-area-inset-bottom));
    }

    a { color: inherit; text-decoration: none; }

    .shell {
      width: min(100%, 362px);
      max-width: calc(100vw - 28px);
      display: grid;
      gap: 14px;
    }

    .card {
      width: 100%;
      border: 1px solid var(--line);
      border-top: 3px solid var(--gold);
      border-radius: 28px;
      background:
        radial-gradient(circle at top, rgba(201,162,39,.05), transparent 32%),
        linear-gradient(180deg, #090909, #030303);
      box-shadow: var(--shadow);
      padding: 18px;
      overflow: hidden;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .seal {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: linear-gradient(145deg, var(--navy), #102a54);
      border: 2px solid var(--gold);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }

    .brand-text strong {
      display: block;
      font-size: 1.04rem;
      font-weight: 800;
    }

    .brand-text .role {
      display: block;
      color: var(--gold);
      font-size: .78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .5px;
      margin-top: 2px;
    }

    .brand-text span {
      display: block;
      color: var(--muted);
      font-size: .8rem;
      margin-top: 1px;
    }

    .qr-box {
      border-radius: 22px;
      background: #fff;
      padding: 16px;
    }

    .qr-box img {
      display: block;
      width: 100%;
      height: auto;
      image-rendering: crisp-edges;
    }

    .actions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-top: 16px;
    }

    .btn {
      min-height: 50px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 0 14px;
      border: 1px solid var(--line);
      background: #0b0b0b;
      font-weight: 800;
      font-size: .92rem;
      line-height: 1.1;
      transition: opacity .12s;
    }

    .btn:hover { opacity: .82; }
    .btn:active { opacity: .65; transform: scale(.97); }
    .btn.full { grid-column: 1 / -1; }

    .btn.gold {
      background: var(--gold);
      color: #000;
      border-color: var(--gold);
    }

    .btn.navy {
      background: var(--navy);
      color: #fff;
      border-color: var(--navy);
    }

    .btn.sms {
      background: #071407;
      color: #4ade80;
      border-color: #166534;
    }

    .note {
      color: #4a5a6a;
      text-align: center;
      font-size: .82rem;
    }

    @media (max-width: 600px) {
      body { place-items: start; }
      .shell { margin-left: 0; margin-right: auto; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="card" aria-label="Mayor Timika Price QR">

      <div class="brand">
        <div class="seal" aria-hidden="true">⚖️</div>
        <div class="brand-text">
          <strong>Timika Price</strong>
          <span class="role">Mayor — City of Colfax</span>
          <span>Grant Parish · Louisiana</span>
        </div>
      </div>

      <div class="qr-box">
        <img src="/colfax/mayor/qr/assets/mayor-price-qr.png"
             alt="QR code linking to Mayor Timika Price contact card" />
      </div>

      <div class="actions">
        <a class="btn gold full" href="/colfax/mayor/">Open Contact Card</a>
        <a class="btn sms full"
           href="sms:+13184070871?body=Hello%20Mayor%20Price%2C%20">
          Text Mayor Price
        </a>
        <a class="btn navy" href="tel:+13184070871">Call</a>
        <a class="btn" href="/colfax/mayor/timika-price.vcf">Save Contact</a>
      </div>

    </section>

    <div class="note">Add this page to Home Screen as "QR".</div>
  </main>
</body>
</html>
