<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Calvin Celestine</title>
  <meta name="robots" content="noindex,nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      min-height: 100%;
      background: #0a0a0f;
      font-family: "Inter", system-ui, sans-serif;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    body {
      padding: 2rem 1rem;
      background:
        radial-gradient(ellipse at 30% 10%, rgba(80, 40, 160, 0.35) 0%, transparent 55%),
        radial-gradient(ellipse at 75% 85%, rgba(30, 80, 140, 0.3) 0%, transparent 55%),
        #0a0a0f;
    }

    .card {
      width: 100%;
      max-width: 400px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.09);
      border-radius: 24px;
      padding: 2.5rem 2rem 2rem;
      text-align: center;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .avatar {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: linear-gradient(135deg, #3a1a7a, #1a3a7a);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.2rem;
      font-weight: 900;
      letter-spacing: .04em;
      color: #fff;
      margin: 0 auto 1.4rem;
      border: 2px solid rgba(255,255,255,0.12);
    }

    .name {
      font-size: 1.85rem;
      font-weight: 900;
      letter-spacing: -.01em;
      line-height: 1.1;
      margin-bottom: .4rem;
      background: linear-gradient(135deg, #ffffff 0%, #c4b5fd 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .divider {
      width: 40px;
      height: 2px;
      background: linear-gradient(90deg, #7c3aed, #3b82f6);
      border-radius: 2px;
      margin: 1.1rem auto 1.4rem;
    }

    .phone-link {
      display: inline-flex;
      align-items: center;
      gap: .55rem;
      color: #e2d9ff;
      text-decoration: none;
      font-size: 1.15rem;
      font-weight: 600;
      letter-spacing: .01em;
      padding: .65rem 1.4rem;
      border-radius: 50px;
      border: 1px solid rgba(124,58,237,0.4);
      background: rgba(124,58,237,0.12);
      transition: background .2s, border-color .2s;
      margin-bottom: 2rem;
    }
    .phone-link:hover { background: rgba(124,58,237,0.22); border-color: rgba(124,58,237,0.7); }
    .phone-link svg { flex-shrink: 0; }

    .qr-wrap {
      background: #fff;
      border-radius: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 14px;
      margin-bottom: 1rem;
    }

    #qr-canvas { display: block; }

    .qr-label {
      font-size: .75rem;
      color: rgba(255,255,255,0.35);
      letter-spacing: .06em;
      text-transform: uppercase;
    }

    .save-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: .5rem;
      width: 100%;
      margin-top: 1.6rem;
      padding: .85rem;
      background: linear-gradient(135deg, #7c3aed, #3b82f6);
      border: none;
      border-radius: 12px;
      color: #fff;
      font-family: inherit;
      font-size: .95rem;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: .02em;
      text-decoration: none;
      transition: opacity .2s;
    }
    .save-btn:hover { opacity: .88; }

    .built-by {
      margin-top: 2rem;
      font-size: .7rem;
      color: rgba(255,255,255,0.18);
      letter-spacing: .05em;
    }
    .built-by a { color: rgba(255,255,255,0.28); text-decoration: none; }
  </style>
</head>
<body>
  <div class="card">
    <div class="avatar">CC</div>

    <div class="name">Calvin Celestine</div>

    <div class="divider"></div>

    <a class="phone-link" href="tel:+13182295427">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.15 12a19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 3.06 1h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L7.09 8.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 21 16z"/>
      </svg>
      +1 (318) 229-5427
    </a>

    <div class="qr-wrap">
      <canvas id="qr-canvas"></canvas>
    </div>

    <div class="qr-label">Scan to call</div>

    <a class="save-btn" href="data:text/vcard;charset=utf-8,BEGIN%3AVCARD%0AVERSION%3A3.0%0AFN%3ACalvin%20Celestine%0AN%3ACelestine%3BCalvin%3B%3B%3B%0ATEL%3BTYPE%3DCELL%3A%2B13182295427%0AEND%3AVCARD" download="Calvin_Celestine.vcf">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
      </svg>
      Save Contact
    </a>

    <div class="built-by">Built by <a href="https://squarebidness.com" target="_blank">Square Bidness</a></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
  <script>
    QRCode.toCanvas(
      document.getElementById('qr-canvas'),
      'tel:+13182295427',
      {
        width: 180,
        margin: 1,
        color: { dark: '#0a0a0f', light: '#ffffff' },
        errorCorrectionLevel: 'M'
      }
    );
  </script>
</body>
</html>
