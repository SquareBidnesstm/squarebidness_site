<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Toby Love — TTM Construction</title>
  <meta name="description" content="Toby Love · TTM Construction Solution LLC · (318) 709-6563" />
  <meta name="robots" content="noindex,nofollow" />
  <meta name="theme-color" content="#0a0a0a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Toby Love" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="apple-touch-icon" href="/ttm/apple-touch.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/ttm/icon.png" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { background: #0a0a0a; }
    body {
      min-height: 100svh;
      background:
        radial-gradient(ellipse 100% 50% at 50% 0%, rgba(201,162,39,.18) 0%, transparent 60%),
        #0a0a0a;
      color: #f5f5f5;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
      display: flex; flex-direction: column; align-items: center;
      padding: 0 0 40px;
    }

    /* ── HEADER BAND ── */
    .card-header {
      width: 100%;
      display: flex; flex-direction: column; align-items: center;
      padding: 52px 24px 32px;
      text-align: center;
      position: relative;
    }

    .avatar {
      width: 96px; height: 96px;
      border-radius: 24px;
      border: 2px solid rgba(201,162,39,.4);
      overflow: hidden;
      background: #111;
      box-shadow: 0 0 48px rgba(201,162,39,.22);
      margin-bottom: 18px;
    }
    .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }

    .card-name {
      font-size: 2rem; font-weight: 900;
      letter-spacing: -.03em; line-height: 1;
      color: #fff;
    }
    .card-title {
      font-size: .78rem; font-weight: 700;
      letter-spacing: .14em; text-transform: uppercase;
      color: #c9a227; margin-top: 8px;
    }
    .card-company {
      font-size: .9rem; color: rgba(255,255,255,.55);
      margin-top: 5px; line-height: 1.4;
    }

    /* gold divider */
    .gold-line {
      width: 48px; height: 3px;
      background: linear-gradient(90deg, transparent, #c9a227, transparent);
      border-radius: 2px; margin: 20px auto 0;
    }

    /* ── ACTION BUTTONS ── */
    .actions {
      width: 100%; max-width: 360px;
      padding: 0 20px;
      display: flex; flex-direction: column; gap: 12px;
      margin-top: 28px;
    }

    .btn-action {
      display: flex; align-items: center; gap: 14px;
      background: #111; border: 1px solid #222;
      border-radius: 16px; padding: 16px 18px;
      text-decoration: none; color: #f5f5f5;
      transition: border-color .15s, transform .1s;
    }
    .btn-action:active { transform: scale(.97); }
    .btn-action:hover  { border-color: rgba(201,162,39,.4); }

    .btn-icon {
      width: 42px; height: 42px; border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .btn-icon.phone { background: rgba(52,211,153,.12); }
    .btn-icon.email { background: rgba(99,179,237,.12); }
    .btn-icon.save  { background: rgba(201,162,39,.12); }
    .btn-icon.quote { background: rgba(167,139,250,.12); }

    .btn-label { font-size: .72rem; color: #666; letter-spacing: .06em; text-transform: uppercase; margin-bottom: 2px; }
    .btn-value { font-size: .96rem; font-weight: 700; }

    /* ── SAVE CTA ── */
    .save-cta {
      display: flex; align-items: center; justify-content: center; gap: 9px;
      background: #c9a227; color: #000;
      font-weight: 900; font-size: 1rem;
      border-radius: 999px; padding: 17px 28px;
      text-decoration: none;
      box-shadow: 0 4px 24px rgba(201,162,39,.28);
      transition: background .15s, transform .1s;
      width: 100%; max-width: 360px;
      margin: 28px 20px 0;
    }
    .save-cta:active { transform: scale(.97); }
    .save-cta:hover  { background: #d9b030; }

    .divider-row {
      width: 100%; max-width: 360px;
      padding: 0 20px; margin-top: 12px;
    }
    .divider-row a {
      display: flex; align-items: center; justify-content: center;
      gap: 8px; color: rgba(255,255,255,.35);
      font-size: .82rem; font-weight: 600;
      text-decoration: none; padding: 10px 0;
      border: 1px solid #1a1a1a; border-radius: 999px;
      transition: color .15s, border-color .15s;
    }
    .divider-row a:hover { color: #c9a227; border-color: rgba(201,162,39,.3); }

    /* ── TAGLINE ── */
    .tagline {
      margin-top: 36px;
      font-size: .7rem; font-weight: 700;
      letter-spacing: .15em; text-transform: uppercase;
      color: rgba(255,255,255,.18);
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="card-header">
    <div class="avatar">
      <img src="/ttm/logo.png" alt="TTM Construction" />
    </div>
    <div class="card-name">Toby Love</div>
    <div class="card-title">Owner</div>
    <div class="card-company">TTM Construction Solution LLC</div>
    <div class="gold-line"></div>
  </div>

  <div class="actions">
    <a class="btn-action" href="tel:+13187096563">
      <div class="btn-icon phone">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
          <path d="M6.5 3.5C6.5 3.5 5 6 5 8c0 4.418 3.582 8 8 8 2 0 4.5-1.5 4.5-1.5L15 11l-2.5 1C11 11 9 9 8 7.5L9 5 6.5 3.5Z" stroke="#34d399" stroke-width="1.5" stroke-linejoin="round"/>
        </svg>
      </div>
      <div>
        <div class="btn-label">Call</div>
        <div class="btn-value">(318) 709-6563</div>
      </div>
    </a>

    <a class="btn-action" href="mailto:marcvmns2@gmail.com">
      <div class="btn-icon email">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
          <rect x="3" y="5" width="14" height="10" rx="2" stroke="#63b3ed" stroke-width="1.5"/>
          <path d="M3 7l7 5 7-5" stroke="#63b3ed" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </div>
      <div>
        <div class="btn-label">Email</div>
        <div class="btn-value">marcvmns2@gmail.com</div>
      </div>
    </a>
  </div>

  <a class="save-cta" href="/ttm/toby.vcf" download="Toby_Love_TTM.vcf">
    <svg width="19" height="19" viewBox="0 0 20 20" fill="none">
      <circle cx="10" cy="7" r="3.5" stroke="#000" stroke-width="1.6"/>
      <path d="M3 17c0-3.314 3.134-6 7-6s7 2.686 7 6" stroke="#000" stroke-width="1.6" stroke-linecap="round"/>
    </svg>
    Save Contact
  </a>

  <div class="divider-row">
    <a href="/ttm/invoice/">
      <svg width="16" height="16" viewBox="0 0 20 20" fill="none">
        <rect x="3" y="2" width="14" height="16" rx="2" stroke="currentColor" stroke-width="1.5"/>
        <path d="M7 7h6M7 10h6M7 13h4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      Request an Estimate
    </a>
  </div>

  <div class="tagline">TTM Construction · Built Right. Done Right.</div>

</body>
</html>
