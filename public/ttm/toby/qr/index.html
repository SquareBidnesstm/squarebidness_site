<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Toby QR | TTM Construction</title>
  <meta name="description" content="TTM Construction Solution LLC — Toby Love QR contact page." />
  <meta name="robots" content="noindex,nofollow" />
  <meta name="theme-color" content="#0a0a0a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="TTM QR" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="canonical" href="https://www.squarebidness.com/ttm/toby/qr/" />
  <link rel="manifest" href="/ttm/toby/qr/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/ttm/apple-touch.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/ttm/icon.png" />

  <style>
    :root {
      --bg:    #0a0a0a;
      --panel: rgba(255,255,255,.06);
      --line:  rgba(255,255,255,.10);
      --text:  #f8f8f8;
      --muted: rgba(255,255,255,.55);
      --gold:  #c9a227;
      --gold-dim: rgba(201,162,39,.32);
    }

    *, *::before, *::after { box-sizing: border-box; }
    html { background: var(--bg); }
    body {
      margin: 0;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: clamp(20px,5vw,46px) 16px;
      background:
        radial-gradient(circle at 50% 0%, rgba(201,162,39,.14), transparent 28rem),
        var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .shell {
      width: 358px;
      max-width: calc(100vw - 32px);
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 28px;
      background: linear-gradient(180deg, rgba(255,255,255,.07), rgba(255,255,255,.02));
      box-shadow: 0 22px 64px rgba(0,0,0,.65);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 18px;
    }

    .mark {
      width: 56px; height: 56px;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid var(--gold-dim);
      background: #000;
      flex: 0 0 auto;
      box-shadow: 0 0 18px rgba(201,162,39,.18);
    }
    .mark img { width: 100%; height: 100%; object-fit: cover; display: block; }

    h1 { margin: 0; font-size: 1.28rem; font-weight: 900; line-height: 1.1; letter-spacing: -.02em; }
    h1 span { color: var(--gold); }
    .brand-sub { margin: 4px 0 0; color: var(--muted); font-size: .95rem; }
    .brand-tag { font-size: .7rem; color: rgba(201,162,39,.6); letter-spacing: .06em; margin-top: 2px; }

    .qr-wrap {
      padding: 18px;
      border-radius: 20px;
      background: #fff;
      margin-bottom: 14px;
    }
    .qr-wrap img {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 1;
      object-fit: contain;
      border-radius: 4px;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .btn {
      min-height: 54px;
      border-radius: 999px;
      border: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px 14px;
      color: var(--text);
      text-decoration: none;
      font-weight: 800;
      font-size: .95rem;
      background: rgba(0,0,0,.4);
      transition: border-color .15s, color .15s;
      text-align: center;
      line-height: 1.2;
    }
    .btn:hover { border-color: var(--gold-dim); color: var(--gold); }

    .btn.primary {
      grid-column: 1 / -1;
      background: #fff;
      color: #000;
      border-color: #fff;
    }
    .btn.primary:hover { background: #f0f0f0; color: #000; }

    .btn.gold {
      color: var(--gold);
      border-color: var(--gold-dim);
      background: rgba(201,162,39,.08);
    }
    .btn.gold:hover { background: rgba(201,162,39,.15); }

    .hint {
      margin: 18px 0 0;
      color: rgba(255,255,255,.38);
      text-align: center;
      font-size: .88rem;
    }
  </style>
</head>

<body>
  <main>
    <section class="shell" aria-label="TTM Construction Toby QR">
      <header class="brand">
        <div class="mark">
          <img src="/ttm/logo.png" alt="TTM Construction" width="192" height="192" />
        </div>
        <div>
          <h1>TTM <span>Construction</span></h1>
          <div class="brand-sub">Toby Love</div>
          <div class="brand-tag">NO JOB TOO SMALL OR TOO LARGE</div>
        </div>
      </header>

      <div class="qr-wrap">
        <img
          src="/ttm/toby/qr/qr.png"
          alt="QR code — squarebidness.com/ttm/"
          width="820"
          height="820"
          loading="eager"
          decoding="async"
        />
      </div>

      <nav class="actions" aria-label="TTM quick links">
        <a class="btn primary" href="/ttm/">TTM Construction</a>
        <a class="btn gold" href="/ttm/toby.vcf" download="Toby_Love_TTM.vcf">Save Contact</a>
        <a class="btn gold" href="/ttm/invoice/">Get a Quote</a>
        <a class="btn" href="tel:+13187096563">(318) 709-6563</a>
      </nav>
    </section>

    <p class="hint">Add this page to Home Screen as "TTM QR".</p>
  </main>
</body>
</html>
