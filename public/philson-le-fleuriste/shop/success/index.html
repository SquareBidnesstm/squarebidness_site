<!doctype html>
<html lang="en" data-sb-brand="philson" data-sb-tier="public">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Order Confirmed — Philson Le Fleuriste</title>
  <meta name="robots" content="noindex,nofollow" />
  <link rel="icon" href="/philson-le-fleuriste/assets/icons/favicon-48.png" type="image/png" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@400;500&display=swap" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f8f5ef;
      --ink: #1a1614;
      --sub: #5a524a;
      --rule: #ddd5c8;
      --accent: #6b4c3b;
      --green: #20482c;
      --green-bg: #e7f6ec;
    }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 15px;
      line-height: 1.7;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      border-bottom: 1px solid var(--rule);
      padding: 24px 32px;
      text-align: center;
    }
    header a {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 20px;
      font-weight: 600;
      color: var(--ink);
      text-decoration: none;
    }
    main {
      flex: 1;
      max-width: 560px;
      margin: 0 auto;
      padding: 72px 32px 80px;
      text-align: center;
    }
    .check {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: var(--green-bg);
      color: var(--green);
      font-size: 28px;
      margin-bottom: 28px;
    }
    h1 {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 36px;
      font-weight: 600;
      line-height: 1.2;
      margin-bottom: 16px;
    }
    p { color: var(--sub); margin-bottom: 14px; }
    .actions { margin-top: 36px; display: flex; flex-direction: column; gap: 12px; align-items: center; }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 15px 28px;
      border-radius: 999px;
      font-size: 15px;
      font-weight: 700;
      text-decoration: none;
      transition: .16s;
    }
    .btn-dark { background: #111; color: #fff; }
    .btn-outline { background: #fff; color: var(--ink); border: 1px solid var(--rule); }
    footer {
      border-top: 1px solid var(--rule);
      padding: 20px 32px;
      font-size: 12px;
      color: var(--sub);
      text-align: center;
    }
    footer a { color: var(--accent); text-decoration: none; }
  </style>
</head>
<body>

<header>
  <a href="/philson-le-fleuriste/">Philson Le Fleuriste</a>
</header>

<main>
  <div class="check">✓</div>
  <h1>Order confirmed.</h1>
  <p>Thank you for your order. Philson will be in touch to confirm pickup or delivery details.</p>
  <p>Check your email for a payment receipt from Stripe.</p>
  <div class="actions">
    <a class="btn btn-dark" href="/philson-le-fleuriste/">Back to Philson Le Fleuriste</a>
    <a class="btn btn-outline" href="/philson-le-fleuriste/socials/">Contact Philson</a>
  </div>
</main>

<footer>
  &copy; 2026 Philson Le Fleuriste &nbsp;·&nbsp;
  <a href="/philson-le-fleuriste/privacy/">Privacy</a> &nbsp;·&nbsp;
  <a href="/philson-le-fleuriste/terms/">Terms</a>
</footer>

</body>
</html>
