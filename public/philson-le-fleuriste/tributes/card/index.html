<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>QR Card — Philson Le Fleuriste</title>
  <meta name="robots" content="noindex,nofollow" />
  <style>
    :root{
      --gold:#8b6914;
      --gold-light:#c49a28;
      --muted:#7a6e62;
      --line:#e6ddd0;
      --text:#1a1410;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      background:#e8e4dc;
      font-family:Georgia,serif;
      min-height:100vh;
      display:flex;
      flex-direction:column;
      align-items:center;
      padding:32px 16px;
      gap:24px;
    }

    /* Screen toolbar */
    .toolbar{
      display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:center;
    }
    .toolbar button{
      border:none;border-radius:999px;padding:11px 22px;
      font-weight:700;cursor:pointer;font-size:.88rem;font-family:system-ui,sans-serif;
    }
    .btn-print{background:var(--gold-light);color:#fff}
    .btn-back{background:#fff;color:var(--text);border:1px solid var(--line)}
    .toolbar p{font-family:system-ui,sans-serif;font-size:.8rem;color:#666;text-align:center}

    /* Preview wrapper */
    .preview-wrap{
      display:flex;flex-direction:column;align-items:center;gap:16px;
    }
    .preview-label{
      font-family:system-ui,sans-serif;font-size:.72rem;letter-spacing:.12em;
      text-transform:uppercase;color:#888;
    }

    /* The printable card — standard 4×6 insert card size */
    .card{
      width:3.5in;
      background:#fff;
      border-radius:10px;
      box-shadow:0 8px 40px rgba(0,0,0,.18);
      overflow:hidden;
      display:flex;
      flex-direction:column;
      align-items:center;
      padding:0.28in 0.3in 0.24in;
      gap:0;
    }
    .card-top-rule{
      width:100%;
      height:2px;
      background:linear-gradient(90deg,#c49a28,#8b6914);
      margin-bottom:0.18in;
      border-radius:2px;
    }
    .card-brand{
      display:flex;flex-direction:column;align-items:center;gap:6px;
      margin-bottom:0.14in;
    }
    .card-brand img{
      width:38px;height:38px;border-radius:7px;object-fit:cover;
    }
    .card-brand .brand-name{
      font-size:.62rem;letter-spacing:.18em;text-transform:uppercase;
      color:var(--muted);font-family:system-ui,sans-serif;
    }
    .card-tribute-name{
      font-size:.95rem;text-align:center;line-height:1.3;
      color:var(--text);margin-bottom:0.06in;
      letter-spacing:.02em;
    }
    .card-date{
      font-family:system-ui,sans-serif;font-size:.68rem;color:var(--muted);
      letter-spacing:.06em;margin-bottom:0.18in;
    }
    .card-qr{
      width:1.6in;height:1.6in;border-radius:8px;overflow:hidden;
      background:#f8f5ef;display:flex;align-items:center;justify-content:center;
      margin-bottom:0.16in;
    }
    .card-qr img{width:100%;height:100%;display:block}
    .card-cta{
      font-family:system-ui,sans-serif;font-size:.66rem;letter-spacing:.1em;
      text-transform:uppercase;color:var(--muted);text-align:center;margin-bottom:0.1in;
    }
    .card-url{
      font-family:system-ui,sans-serif;font-size:.6rem;color:#b0a898;
      text-align:center;word-break:break-all;
    }
    .card-bottom-rule{
      width:100%;height:1.5px;
      background:var(--line);
      margin-top:0.16in;
    }

    /* Print styles */
    @media print {
      body{background:#fff;padding:0;gap:0;display:block}
      .toolbar,.preview-label,.preview-wrap > .preview-label{display:none}
      .preview-wrap{align-items:flex-start}

      /* Print 3 cards per page in a grid */
      .print-grid{
        display:grid;
        grid-template-columns:3.5in 3.5in;
        gap:0.25in;
        padding:0.4in;
      }
      .card{
        box-shadow:none;
        border:1px solid #ccc;
        border-radius:6px;
        page-break-inside:avoid;
      }
    }
  </style>
</head>
<body>

<div class="toolbar">
  <button class="btn-print" onclick="window.print()">🖨 Print QR Cards</button>
  <button class="btn-back" onclick="history.back()">← Back to Admin</button>
  <p>Cards print 2-up on a standard sheet. Cut and place on each arrangement.</p>
</div>

<div class="preview-wrap">
  <div class="preview-label">Preview</div>

  <!-- 2 identical cards for printing 2-up -->
  <div class="print-grid" id="cardGrid">
    <div class="card" id="card1">
      <div class="card-top-rule"></div>
      <div class="card-brand">
        <img src="/philson-le-fleuriste/assets/icons/favicon-48.png" alt="Philson" onerror="this.style.display='none'" />
        <span class="brand-name">Philson Le Fleuriste</span>
      </div>
      <div class="card-tribute-name" id="card-name1">Loading&hellip;</div>
      <div class="card-date" id="card-date1"></div>
      <div class="card-qr">
        <img id="qr-img1" src="" alt="QR Code" />
      </div>
      <div class="card-cta">Scan to view the floral arrangements</div>
      <div class="card-url" id="card-url1"></div>
      <div class="card-bottom-rule"></div>
    </div>

    <div class="card" id="card2">
      <div class="card-top-rule"></div>
      <div class="card-brand">
        <img src="/philson-le-fleuriste/assets/icons/favicon-48.png" alt="Philson" onerror="this.style.display='none'" />
        <span class="brand-name">Philson Le Fleuriste</span>
      </div>
      <div class="card-tribute-name" id="card-name2">Loading&hellip;</div>
      <div class="card-date" id="card-date2"></div>
      <div class="card-qr">
        <img id="qr-img2" src="" alt="QR Code" />
      </div>
      <div class="card-cta">Scan to view the floral arrangements</div>
      <div class="card-url" id="card-url2"></div>
      <div class="card-bottom-rule"></div>
    </div>
  </div>
</div>

<script>
function getSlug() {
  return new URLSearchParams(location.search).get("id") || new URLSearchParams(location.search).get("slug") || "";
}

function formatDate(dateStr) {
  if (!dateStr) return "";
  const d = new Date(dateStr + "T12:00:00");
  return d.toLocaleDateString("en-US", { month: "long", day: "numeric", year: "numeric" });
}

function qrUrl(targetUrl) {
  return `https://api.qrserver.com/v1/create-qr-code/?data=${encodeURIComponent(targetUrl)}&size=280x280&margin=8&color=1a1410&bgcolor=f8f5ef&format=png`;
}

async function loadCard() {
  const slug = getSlug();
  if (!slug) {
    ["card-name1","card-name2"].forEach(id => document.getElementById(id).textContent = "No tribute ID provided.");
    return;
  }

  const tributeUrl = `${location.origin}/philson-le-fleuriste/tributes/view/?id=${slug}`;
  const token = localStorage.getItem("philson_tribute_token") || "";

  let name = slug, date = "";

  try {
    const res = await fetch(`/api/philson/tributes/get/?slug=${encodeURIComponent(slug)}&admin=1`, {
      headers: token ? { "x-operator-token": token } : {}
    });
    const data = await res.json();
    if (data.ok && data.tribute) {
      name = data.tribute.name || slug;
      date = data.tribute.date || "";
    }
  } catch { /* use slug as fallback name */ }

  const qrSrc = qrUrl(tributeUrl);
  const dateStr = formatDate(date);

  for (const n of [1, 2]) {
    document.getElementById(`card-name${n}`).textContent = name;
    document.getElementById(`card-date${n}`).textContent = dateStr;
    document.getElementById(`card-date${n}`).style.display = dateStr ? "" : "none";
    document.getElementById(`qr-img${n}`).src = qrSrc;
    document.getElementById(`card-url${n}`).textContent = tributeUrl.replace("https://", "");
  }

  document.title = `QR Card — ${name}`;
}

loadCard();
</script>
</body>
</html>
