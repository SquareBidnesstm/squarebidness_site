<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Payment Received — Philson Le Fleuriste</title>
  <link rel="icon" href="/philson-le-fleuriste/assets/icons/favicon-48.png" type="image/png" />
  <style>
    :root{
      --bg:#f8f5ef;--paper:#fff;--line:#e6ddd0;--text:#1d1a16;
      --muted:#6f675e;--soft:#f2ede4;--dark:#111;
      --ok:#e7f6ec;--oktext:#20482c;--shadow:0 16px 46px rgba(0,0,0,.08);
    }
    *{box-sizing:border-box}
    body{
      margin:0;min-height:100vh;
      font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;
      background:radial-gradient(900px 500px at 0% 0%,rgba(184,147,85,.10),transparent 55%),
                 radial-gradient(800px 400px at 100% 100%,rgba(244,213,220,.25),transparent 45%),var(--bg);
      color:var(--text);display:grid;place-items:center;padding:32px 16px;
    }
    .card{
      width:min(560px,100%);background:var(--paper);border:1px solid var(--line);
      border-radius:28px;box-shadow:var(--shadow);overflow:hidden;text-align:center;
    }
    .top-band{
      background:var(--ok);border-bottom:1px solid rgba(32,72,44,.12);
      padding:18px 32px;display:flex;align-items:center;justify-content:center;
      gap:10px;color:var(--oktext);font-weight:900;font-size:.82rem;
      letter-spacing:.12em;text-transform:uppercase;
    }
    .dot{width:8px;height:8px;border-radius:50%;background:#28d17c;box-shadow:0 0 12px rgba(40,209,124,.7)}
    .body{padding:36px 32px 28px}
    .logo{margin:0 auto 20px;display:block}
    .logo img{width:min(220px,100%);height:auto}
    h1{
      font-family:Georgia,"Times New Roman",serif;
      font-size:clamp(2rem,5vw,3rem);line-height:1;font-weight:500;
      letter-spacing:-.04em;margin:0 0 12px;
    }
    .sub{color:var(--muted);font-size:15px;line-height:1.75;margin:0 0 28px;max-width:44ch;margin-left:auto;margin-right:auto}
    .actions{display:flex;flex-direction:column;gap:10px}
    .btn{
      display:flex;align-items:center;justify-content:center;
      padding:15px 22px;border-radius:999px;border:1px solid var(--line);
      background:var(--paper);color:var(--text);font-size:15px;font-weight:900;
      text-decoration:none;transition:.16s ease;
    }
    .btn:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
    .btn.primary{background:var(--dark);color:#fff;border-color:var(--dark)}
    footer{margin-top:10px;padding:16px 32px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
  </style>
</head>
<body>
  <div class="card">
    <div class="top-band"><span class="dot"></span> Payment Received</div>
    <div class="body">
      <a class="logo" href="/philson-le-fleuriste/">
        <img src="/philson-le-fleuriste/assets/logo/philson-2014_1200.png" alt="Philson Le Fleuriste" />
      </a>
      <h1>Thank You.</h1>
      <p class="sub">Your payment has been received. Philson will confirm the details and follow up with you shortly.</p>
      <div class="actions">
        <a class="btn primary" href="/philson-le-fleuriste/">Back to Philson Le Fleuriste</a>
        <a class="btn" href="/philson-le-fleuriste/tributes/">View Tribute Gallery</a>
      </div>
    </div>
    <footer>© <span id="y"></span> Philson Le Fleuriste</footer>
  </div>
  <script>document.getElementById("y").textContent = new Date().getFullYear();</script>
</body>
</html>
