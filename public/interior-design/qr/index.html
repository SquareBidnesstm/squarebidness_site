<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />

  <title>SB Interior Design</title>
  <meta name="description" content="Square Bidness Interior Design — scan to explore" />
  <link rel="canonical" href="https://www.squarebidness.com/interior-design/qr/" />

  <meta property="og:type" content="website" />
  <meta property="og:title" content="SB Interior Design" />
  <meta property="og:description" content="Square Bidness Interior Design" />
  <meta property="og:url" content="https://www.squarebidness.com/interior-design/qr/" />
  <meta property="og:image" content="https://www.squarebidness.com/interior-design/assets/og_interior_design_hero_1200x630.jpg" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="SB Interior Design" />
  <meta name="twitter:image" content="https://www.squarebidness.com/interior-design/assets/og_interior_design_hero_1200x630.jpg" />

  <meta name="theme-color" content="#f6f4ef" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />

  <link rel="manifest" href="/interior-design/qr/manifest.json" />
  <link rel="icon" href="/interior-design/assets/favicon-32x32.png" sizes="32x32" type="image/png" />
  <link rel="icon" href="/interior-design/assets/favicon-16x16.png" sizes="16x16" type="image/png" />
  <link rel="icon" href="/interior-design/assets/favicon-48x48.png" sizes="48x48" type="image/png" />
  <link rel="apple-touch-icon" href="/interior-design/assets/apple-touch-icon.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" defer></script>

  <style>
    :root {
      --bg: #f6f4ef;
      --card: #fff;
      --gold: #b79c6e;
      --gold2: #8f7a55;
      --ink: #101010;
      --muted: #6b5e4a;
      --stroke: rgba(183,156,110,.3);
      --line: rgba(0,0,0,.10);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      background: var(--bg);
      color: var(--ink);
      font-family: 'Inter', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      min-height: 100svh;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100svh;
      padding: env(safe-area-inset-top, 32px) 24px env(safe-area-inset-bottom, 32px);
    }

    .wrap {
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }

    /* Header */
    .header {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      text-align: center;
    }

    .eyebrow {
      font-size: 10px;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--gold);
      font-weight: 600;
    }

    .brand-name {
      font-family: 'Playfair Display', serif;
      font-size: 26px;
      font-weight: 600;
      color: var(--ink);
      letter-spacing: .02em;
      line-height: 1.2;
    }

    .brand-sub {
      font-size: 12px;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 500;
    }

    /* Divider */
    .rule {
      width: 48px;
      height: 1px;
      background: var(--gold);
      opacity: .6;
    }

    /* QR */
    .qr-wrap {
      background: #fff;
      border-radius: 12px;
      padding: 18px;
      width: 236px;
      height: 236px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--line);
      box-shadow: 0 2px 16px rgba(0,0,0,.07);
    }

    #qr canvas, #qr img { display: block; }

    .qr-label {
      font-size: 11px;
      color: var(--muted);
      letter-spacing: .06em;
      text-align: center;
    }

    /* Buttons */
    .actions {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 14px 20px;
      border-radius: 6px;
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--ink);
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: .03em;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .btn--gold {
      background: var(--gold);
      border-color: var(--gold);
      color: #fff;
    }

    .btn--outline {
      background: transparent;
      border-color: var(--stroke);
      color: var(--gold2);
    }

    .btn--row {
      display: flex;
      gap: 10px;
    }

    .btn--row .btn { flex: 1; }

    .footer-note {
      font-size: 11px;
      color: var(--muted);
      opacity: .7;
      text-align: center;
    }
  </style>
</head>

<body>
  <div class="wrap">

    <div class="header">
      <div class="eyebrow">Square Bidness</div>
      <div class="brand-name">Interior Design</div>
      <div class="rule"></div>
      <div class="brand-sub">Spaces Built with Intention</div>
    </div>

    <div class="qr-wrap">
      <div id="qr"></div>
    </div>

    <div class="qr-label">Scan to visit squarebidness.com/interior-design</div>

    <div class="actions">
      <a class="btn btn--gold" href="/interior-design/">Explore Services →</a>

      <div class="btn--row">
        <a class="btn btn--outline" href="/interior-design/book/">Book Consult</a>
        <a class="btn btn--outline" id="shareLink">Share</a>
      </div>
    </div>

    <div class="footer-note">squarebidness.com/interior-design</div>

  </div>

  <script>
    const TARGET = "https://www.squarebidness.com/interior-design/";

    function initQR() {
      const el = document.getElementById("qr");
      if (el && !el.innerHTML && typeof QRCode !== "undefined") {
        new QRCode(el, {
          text: TARGET,
          width: 200,
          height: 200,
          colorDark: "#101010",
          colorLight: "#ffffff",
          correctLevel: QRCode.CorrectLevel.M
        });
      }
    }

    window.addEventListener("DOMContentLoaded", function () {
      initQR();

      document.getElementById("shareLink").addEventListener("click", function (e) {
        e.preventDefault();
        const msg = "Square Bidness Interior Design — " + TARGET;
        if (navigator.share) {
          navigator.share({ title: "SB Interior Design", text: msg, url: TARGET }).catch(function(){});
        } else {
          window.location.href = "sms:&body=" + encodeURIComponent(msg);
        }
      });
    });

    window.addEventListener("load", initQR);
  </script>
</body>
</html>
