<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Delish — Closed Days</title>
  <meta name="robots" content="noindex,nofollow" />
  <link rel="icon" sizes="32x32" href="/delish/assets/delish-favicon-32.png" />
  <style>
    :root{
      --bg:#0f1012; --panel:#181a1f; --line:rgba(255,255,255,.10);
      --text:#f5f2ea; --muted:rgba(255,255,255,.55); --accent:#d7ae72;
      --accent-2:#f2d8ae; --good:#1d6b39; --good-2:#c7f5d6;
      --danger:#a12626; --danger-2:#ffd1d1; --shadow:0 20px 50px rgba(0,0,0,.30);
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{min-height:100%;background:radial-gradient(circle at top,rgba(215,174,114,.10),transparent 35%),linear-gradient(180deg,#0d0e10,#111318);color:var(--text);font-family:Inter,system-ui,sans-serif;}
    body{padding:20px;}
    .wrap{width:min(860px,100%);margin:0 auto;}

    .topbar{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:24px;flex-wrap:wrap;}
    .brand{display:flex;align-items:center;gap:14px;}
    .logo{width:52px;height:52px;border-radius:14px;background:#fff;object-fit:cover;border:1px solid rgba(255,255,255,.08);}
    .page-title{font-size:clamp(1.5rem,3.5vw,2.2rem);font-weight:900;letter-spacing:-.04em;}
    .page-sub{margin-top:4px;font-size:.9rem;color:var(--muted);}
    .back-link{display:flex;align-items:center;gap:6px;padding:10px 18px;border-radius:999px;background:var(--panel);border:1px solid var(--line);color:var(--muted);text-decoration:none;font-size:.9rem;font-weight:700;white-space:nowrap;}
    .back-link:hover{color:var(--text);}

    .status{padding:12px 16px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid var(--line);color:var(--muted);font-size:.95rem;margin-bottom:20px;min-height:48px;display:flex;align-items:center;}
    .status.good{border-color:rgba(29,107,57,.35);background:rgba(29,107,57,.10);color:var(--good-2);}
    .status.bad{border-color:rgba(161,38,38,.35);background:rgba(161,38,38,.10);color:var(--danger-2);}

    .card{padding:28px;border-radius:24px;background:linear-gradient(180deg,#181b21,#14171c);border:1px solid var(--line);box-shadow:var(--shadow);margin-bottom:20px;}
    .card-title{font-size:1.1rem;font-weight:900;letter-spacing:-.02em;margin-bottom:6px;}
    .card-sub{font-size:.88rem;color:var(--muted);margin-bottom:20px;}

    .date-row{display:grid;grid-template-columns:1fr 1fr auto;gap:12px;align-items:end;}
    .field{display:grid;gap:6px;}
    .field label{font-size:.8rem;font-weight:800;text-transform:uppercase;letter-spacing:.10em;color:var(--muted);}
    .field input[type=date]{width:100%;padding:12px 14px;border-radius:12px;background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--text);font-size:1rem;font-family:inherit;cursor:pointer;-webkit-appearance:none;}
    .field input[type=date]:focus{outline:none;border-color:rgba(215,174,114,.5);}

    .btn{min-height:48px;padding:0 20px;border:none;border-radius:12px;font-weight:900;cursor:pointer;font-size:.95rem;font-family:inherit;transition:filter .15s;}
    .btn-gold{background:var(--accent);color:#181410;}
    .btn-gold:hover{filter:brightness(1.08);}
    .btn-gold:disabled{opacity:.5;cursor:not-allowed;}
    .btn-danger{background:rgba(161,38,38,.18);border:1px solid rgba(161,38,38,.30);color:var(--danger-2);min-height:36px;padding:0 14px;font-size:.85rem;border-radius:999px;}
    .btn-danger:hover{background:rgba(161,38,38,.30);}

    .list-empty{padding:32px 24px;border-radius:18px;background:rgba(255,255,255,.03);border:1px solid var(--line);text-align:center;color:var(--muted);}
    .list-empty strong{display:block;font-size:1.4rem;color:var(--text);margin-bottom:6px;letter-spacing:-.03em;}

    .day-list{display:grid;gap:10px;}
    .day-item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 18px;border-radius:16px;background:linear-gradient(180deg,#1b1e25,#15181d);border:1px solid var(--line);}
    .day-item.today{border-color:rgba(215,174,114,.40);}
    .day-date{font-size:1.1rem;font-weight:900;letter-spacing:-.02em;}
    .day-badge{font-size:.75rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:3px 10px;border-radius:999px;background:rgba(215,174,114,.15);border:1px solid rgba(215,174,114,.25);color:var(--accent-2);}

    .save-row{display:flex;justify-content:flex-end;margin-top:6px;}
    .save-btn{min-height:54px;padding:0 32px;font-size:1.05rem;}

    @media(max-width:600px){
      .date-row{grid-template-columns:1fr 1fr;}
      .date-row .btn{grid-column:1/-1;}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div class="brand">
        <img src="/delish/assets/delish-logo-mark-512.png" alt="Delish" class="logo" />
        <div>
          <h1 class="page-title">Closed Days</h1>
          <p class="page-sub">Schedule future dates when ordering will be off</p>
        </div>
      </div>
      <a class="back-link" href="/delish/admin/">← Admin</a>
    </div>

    <div class="status" id="statusBox">Loading...</div>

    <div class="card">
      <div class="card-title">Add Closed Date Range</div>
      <div class="card-sub">Pick a start and end date — all days in between will be added at once.</div>
      <div class="date-row">
        <div class="field">
          <label for="startDate">Start Date</label>
          <input type="date" id="startDate" />
        </div>
        <div class="field">
          <label for="endDate">End Date</label>
          <input type="date" id="endDate" />
        </div>
        <button class="btn btn-gold" id="addBtn">Add</button>
      </div>
    </div>

    <div class="card">
      <div class="card-title">Scheduled Closed Days</div>
      <div class="card-sub">Tap Remove to unschedule a day. Past dates are cleared automatically.</div>
      <div class="day-list" id="dayList">
        <div class="list-empty"><strong>Loading…</strong></div>
      </div>
      <div class="save-row" style="margin-top:20px;">
        <button class="btn btn-gold save-btn" id="saveBtn">Save Changes</button>
      </div>
    </div>
  </div>

  <script>
    const TOKEN_KEY = "delish_operator_token";

    function getToken() {
      try { return localStorage.getItem(TOKEN_KEY) || ""; } catch { return ""; }
    }

    function saveToken(t) {
      try { localStorage.setItem(TOKEN_KEY, t); } catch {}
    }

    function ensureToken() {
      let t = getToken();
      if (!t) {
        t = window.prompt("Enter Delish operator token:") || "";
        if (t.trim()) saveToken(t.trim());
      }
      return t.trim();
    }

    function operatorHeaders(extra = {}) {
      const t = getToken();
      return { ...extra, ...(t ? { "x-operator-token": t } : {}) };
    }

    function setStatus(msg, tone = "") {
      const el = document.getElementById("statusBox");
      el.className = "status" + (tone ? ` ${tone}` : "");
      el.textContent = msg;
    }

    const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
    const DAYS = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];

    function formatDate(iso) {
      const [y, m, d] = iso.split("-").map(Number);
      const dt = new Date(Date.UTC(y, m - 1, d));
      return `${DAYS[dt.getUTCDay()]}, ${MONTHS[m - 1]} ${d}, ${y}`;
    }

    function todayIso() {
      return new Intl.DateTimeFormat("en-CA", { timeZone: "America/Chicago" }).format(new Date());
    }

    let closedDays = [];

    function renderList() {
      const today = todayIso();
      const list = document.getElementById("dayList");

      // Filter out past dates (keep today and future)
      const upcoming = closedDays.filter(d => d >= today).sort();

      if (!upcoming.length) {
        list.innerHTML = `<div class="list-empty"><strong>No closed days scheduled</strong>Orders will follow the normal weekly schedule.</div>`;
        return;
      }

      list.innerHTML = upcoming.map(iso => {
        const isToday = iso === today;
        return `
          <div class="day-item ${isToday ? "today" : ""}">
            <div>
              <div class="day-date">${formatDate(iso)}</div>
              ${isToday ? '<div class="day-badge" style="margin-top:4px;">Today</div>' : ""}
            </div>
            <button class="btn btn-danger" data-remove="${iso}">Remove</button>
          </div>`;
      }).join("");

      document.querySelectorAll("[data-remove]").forEach(btn => {
        btn.addEventListener("click", () => {
          const iso = btn.getAttribute("data-remove");
          closedDays = closedDays.filter(d => d !== iso);
          renderList();
          setStatus("Removed — tap Save Changes to apply.", "");
        });
      });
    }

    async function load() {
      try {
        const res = await fetch("/api/delish/closed-days/", { cache: "no-store" });
        const data = await res.json();
        if (!data.ok) throw new Error(data.error || "Failed to load.");
        closedDays = data.closedDays || [];
        renderList();
        setStatus(`${closedDays.filter(d => d >= todayIso()).length} upcoming closed day(s) loaded.`, "good");
      } catch (e) {
        setStatus("Unable to load closed days.", "bad");
      }
    }

    function datesInRange(start, end) {
      const dates = [];
      const d = new Date(start + "T12:00:00Z");
      const last = new Date(end + "T12:00:00Z");
      while (d <= last) {
        dates.push(d.toISOString().slice(0, 10));
        d.setUTCDate(d.getUTCDate() + 1);
      }
      return dates;
    }

    document.getElementById("addBtn").addEventListener("click", () => {
      const start = document.getElementById("startDate").value;
      const end = document.getElementById("endDate").value || start;
      if (!start) { setStatus("Pick a start date first.", "bad"); return; }
      if (end < start) { setStatus("End date can't be before start date.", "bad"); return; }
      const newDates = datesInRange(start, end);
      const merged = [...new Set([...closedDays, ...newDates])].sort();
      closedDays = merged;
      renderList();
      setStatus(`${newDates.length} day(s) added — tap Save Changes to apply.`, "");
      document.getElementById("startDate").value = "";
      document.getElementById("endDate").value = "";
    });

    document.getElementById("saveBtn").addEventListener("click", async () => {
      const token = ensureToken();
      if (!token) { setStatus("Token required to save.", "bad"); return; }
      const btn = document.getElementById("saveBtn");
      btn.disabled = true;
      btn.textContent = "Saving…";
      const today = todayIso();
      const toSave = closedDays.filter(d => d >= today);
      try {
        const res = await fetch("/api/delish/save-closed-days/", {
          method: "POST",
          headers: operatorHeaders({ "Content-Type": "application/json" }),
          body: JSON.stringify({ closedDays: toSave }),
        });
        if (res.status === 401) {
          saveToken("");
          setStatus("Token rejected — tap Save again to re-enter.", "bad");
          return;
        }
        const data = await res.json();
        if (!data.ok) throw new Error(data.error || "Save failed.");
        closedDays = data.closedDays || [];
        renderList();
        setStatus("Closed days saved.", "good");
      } catch (e) {
        setStatus(e.message || "Save failed.", "bad");
      } finally {
        btn.disabled = false;
        btn.textContent = "Save Changes";
      }
    });

    // Set min date on inputs to today
    const today = todayIso();
    document.getElementById("startDate").min = today;
    document.getElementById("endDate").min = today;

    load();
  </script>
</body>
</html>
