<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Order Lookup — Delish</title>
  <meta name="robots" content="noindex,nofollow" />
  <meta name="theme-color" content="#0b0b0b" />
  <link rel="manifest" href="/delish/manifest.json" />
  <link rel="icon" sizes="16x16" href="/delish/assets/delish-favicon-16.png" />
  <link rel="icon" sizes="32x32" href="/delish/assets/delish-favicon-32.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/delish/assets/delish-logo-mark-180.png" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
  <style>
    :root {
      --bg: #0b0b0b;
      --panel: #141414;
      --panel2: #1c1c1c;
      --line: rgba(255,255,255,.08);
      --text: #f0f0f0;
      --muted: #888;
      --gold: #D4AF37;
      --gold-dim: rgba(212,175,55,.12);
      --gold-border: rgba(212,175,55,.25);
      --green: #22c55e;
      --radius: 16px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: Inter, system-ui, -apple-system, sans-serif;
      font-size: 15px;
      line-height: 1.5;
      min-height: 100vh;
      padding: 0 0 80px;
    }

    /* ── Top bar ── */
    .topbar {
      background: #111;
      border-bottom: 1px solid var(--line);
      padding: 14px 20px;
      display: flex;
      align-items: center;
      gap: 14px;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .topbar-logo {
      width: 36px; height: 36px;
      border-radius: 10px;
      object-fit: cover;
    }
    .topbar-title {
      font-size: 16px;
      font-weight: 800;
      color: var(--gold);
    }
    .topbar-sub {
      font-size: 12px;
      color: var(--muted);
      margin-top: 1px;
    }
    .topbar-back {
      margin-left: auto;
      font-size: 13px;
      color: var(--muted);
      text-decoration: none;
      padding: 6px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
    }
    .topbar-back:hover { color: var(--text); border-color: rgba(255,255,255,.2); }

    /* ── Page content ── */
    .page { max-width: 640px; margin: 0 auto; padding: 28px 20px 0; }

    /* ── Search box ── */
    .search-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 24px;
    }
    .search-card h2 {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 6px;
    }
    .search-card p {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 16px;
    }
    .search-row {
      display: flex;
      gap: 10px;
    }
    .search-input {
      flex: 1;
      background: var(--panel2);
      border: 1px solid var(--line);
      border-radius: 10px;
      color: var(--text);
      font-family: inherit;
      font-size: 15px;
      padding: 11px 14px;
      outline: none;
      transition: border-color .15s;
    }
    .search-input:focus { border-color: var(--gold); }
    .search-input::placeholder { color: #555; }
    .search-btn {
      background: var(--gold);
      color: #000;
      font-family: inherit;
      font-size: 14px;
      font-weight: 700;
      border: none;
      border-radius: 10px;
      padding: 11px 18px;
      cursor: pointer;
      white-space: nowrap;
      transition: opacity .15s;
    }
    .search-btn:hover { opacity: .85; }
    .search-btn:disabled { opacity: .45; cursor: not-allowed; }

    /* ── Status / error ── */
    .status {
      font-size: 13px;
      color: var(--muted);
      margin-top: 12px;
      min-height: 18px;
    }
    .status.error { color: #f87171; }

    /* ── Results ── */
    .results-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 12px;
    }

    .order-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 16px 18px;
      margin-bottom: 10px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
    }
    .order-card:hover { border-color: rgba(255,255,255,.15); }

    .order-info { flex: 1; min-width: 0; }
    .order-number {
      font-size: 14px;
      font-weight: 700;
      color: var(--gold);
      margin-bottom: 4px;
    }
    .order-customer {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 3px;
    }
    .order-meta {
      font-size: 12px;
      color: var(--muted);
    }
    .order-total {
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
      white-space: nowrap;
      padding-top: 2px;
    }

    .order-actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
      flex-wrap: wrap;
    }

    .btn {
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      border-radius: 8px;
      padding: 7px 14px;
      cursor: pointer;
      border: none;
      transition: opacity .15s;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn:hover { opacity: .8; }
    .btn-receipt {
      background: var(--gold);
      color: #000;
    }
    .btn-copy {
      background: var(--panel2);
      color: var(--text);
      border: 1px solid var(--line);
    }
    .btn-copy.copied {
      color: var(--green);
      border-color: rgba(34,197,94,.3);
    }

    .empty {
      text-align: center;
      padding: 40px 20px;
      color: var(--muted);
    }
    .empty strong { display: block; font-size: 15px; margin-bottom: 6px; color: var(--text); }

    /* ── Token prompt ── */
    .token-gate {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 28px 24px;
      text-align: center;
    }
    .token-gate h2 { font-size: 16px; margin-bottom: 8px; }
    .token-gate p { font-size: 13px; color: var(--muted); margin-bottom: 18px; }
    .token-input {
      width: 100%;
      background: var(--panel2);
      border: 1px solid var(--line);
      border-radius: 10px;
      color: var(--text);
      font-family: inherit;
      font-size: 14px;
      padding: 10px 14px;
      outline: none;
      margin-bottom: 10px;
    }
    .token-input:focus { border-color: var(--gold); }
  </style>
</head>
<body>

  <div class="topbar">
    <img class="topbar-logo" src="/delish/assets/delish-logo-mark-192.png" alt="Delish" />
    <div>
      <div class="topbar-title">Order Lookup</div>
      <div class="topbar-sub">Search and retrieve customer receipts</div>
    </div>
    <a class="topbar-back" href="/delish/admin/">← Admin</a>
  </div>

  <div class="page">

    <!-- Token gate -->
    <div class="token-gate" id="tokenGate" hidden>
      <h2>Operator Access Required</h2>
      <p>Enter your Delish operator token to use order lookup.</p>
      <input class="token-input" id="tokenInput" type="password" placeholder="Operator token" autocomplete="current-password" />
      <button class="search-btn" style="width:100%" onclick="saveToken()">Unlock</button>
    </div>

    <!-- Search -->
    <div id="mainContent" hidden>
      <div class="search-card">
        <h2>Find an Order</h2>
        <p>Enter a customer name, phone number, or order number (DL-XXXXXX-XXXX).</p>
        <div class="search-row">
          <input
            class="search-input"
            id="searchInput"
            type="text"
            placeholder="e.g. Derrick Howard or DL-260826-1023"
            autocomplete="off"
            spellcheck="false"
          />
          <button class="search-btn" id="searchBtn" onclick="doSearch()">Search</button>
        </div>
        <div class="status" id="status"></div>
      </div>

      <div id="results"></div>
    </div>

  </div>

  <script>
    const TOKEN_KEY = "delish_operator_token";

    function getSavedToken() {
      try { return localStorage.getItem(TOKEN_KEY) || ""; } catch { return ""; }
    }
    function saveTokenToStorage(t) {
      try { localStorage.setItem(TOKEN_KEY, t); } catch {}
    }

    function saveToken() {
      const val = document.getElementById("tokenInput").value.trim();
      if (!val) return;
      saveTokenToStorage(val);
      init();
    }

    function init() {
      const token = getSavedToken();
      if (!token) {
        document.getElementById("tokenGate").hidden = false;
        document.getElementById("mainContent").hidden = true;
      } else {
        document.getElementById("tokenGate").hidden = true;
        document.getElementById("mainContent").hidden = false;
        document.getElementById("searchInput").focus();
      }
    }

    document.getElementById("searchInput").addEventListener("keydown", (e) => {
      if (e.key === "Enter") doSearch();
    });

    async function doSearch() {
      const q = document.getElementById("searchInput").value.trim();
      if (!q) return;

      const token = getSavedToken();
      const status = document.getElementById("status");
      const btn = document.getElementById("searchBtn");

      btn.disabled = true;
      status.className = "status";
      status.textContent = "Searching Stripe…";
      document.getElementById("results").innerHTML = "";

      try {
        const res = await fetch(
          `/api/delish/order-lookup/?q=${encodeURIComponent(q)}`,
          { headers: { "x-operator-token": token } }
        );

        if (res.status === 401) {
          try { localStorage.removeItem(TOKEN_KEY); } catch {}
          status.className = "status error";
          status.textContent = "Token invalid — please refresh and re-enter.";
          return;
        }

        const data = await res.json();

        if (!data.ok) {
          status.className = "status error";
          status.textContent = data.error || "Search failed.";
          return;
        }

        const results = data.results || [];

        if (results.length === 0) {
          status.textContent = `No Delish orders found for "${q}".`;
          document.getElementById("results").innerHTML = `
            <div class="empty">
              <strong>No results</strong>
              Try the full name, exact phone number, or paste the order number.
            </div>`;
          return;
        }

        status.textContent = `${results.length} order${results.length !== 1 ? "s" : ""} found`;
        renderResults(results);
      } catch (err) {
        status.className = "status error";
        status.textContent = "Request failed: " + err.message;
      } finally {
        btn.disabled = false;
      }
    }

    function renderResults(results) {
      const container = document.getElementById("results");
      container.innerHTML = `<div class="results-label">${results.length} Result${results.length !== 1 ? "s" : ""}</div>`;

      results.forEach((order) => {
        const card = document.createElement("div");
        card.className = "order-card";

        const receiptUrl = order.receiptUrl
          ? `https://www.squarebidness.com${order.receiptUrl}`
          : null;

        const metaParts = [
          order.pickupDate || order.createdDate,
          order.pickupWindow,
          order.customerPhone,
        ].filter(Boolean);

        card.innerHTML = `
          <div style="flex:1;min-width:0;">
            <div class="order-number">${order.orderNumber || "—"}</div>
            <div class="order-customer">${order.customerName || "Unknown"}</div>
            <div class="order-meta">${metaParts.join("  ·  ")}</div>
            <div class="order-actions">
              ${receiptUrl ? `<a class="btn btn-receipt" href="${receiptUrl}" target="_blank">View Receipt</a>` : ""}
              ${receiptUrl ? `<button class="btn btn-copy" data-url="${receiptUrl}" onclick="copyLink(this)">Copy Link</button>` : ""}
            </div>
          </div>
          <div class="order-total">${order.total || "—"}</div>
        `;
        container.appendChild(card);
      });
    }

    function copyLink(btn) {
      const url = btn.dataset.url;
      navigator.clipboard.writeText(url).then(() => {
        btn.textContent = "Copied!";
        btn.classList.add("copied");
        setTimeout(() => {
          btn.textContent = "Copy Link";
          btn.classList.remove("copied");
        }, 2000);
      }).catch(() => {
        prompt("Copy this link:", url);
      });
    }

    init();
  </script>
</body>
</html>
