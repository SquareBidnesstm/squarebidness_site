<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>QR</title>
  <meta name="description" content="Quick QR access for Dale Williams — MDW Investments LLC. Commercial Real Estate." />
  <meta name="robots" content="noindex,follow" />
  <meta name="theme-color" content="#cc1515" />
  <meta name="application-name" content="MDW QR" />
  <meta name="apple-mobile-web-app-title" content="MDW QR" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <link rel="canonical" href="https://www.squarebidness.com/mdw/dalewilliams/qr/" />
  <link rel="icon" type="image/png" sizes="16x16" href="/mdw/assets/icons/favicon-16.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/mdw/assets/icons/favicon-32.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/mdw/assets/icons/apple-touch-icon.png" />
  <link rel="manifest" href="/mdw/dalewilliams/qr/manifest.webmanifest" />

  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="MDW Investments LLC" />
  <meta property="og:title" content="Dale Williams QR — MDW Investments LLC" />
  <meta property="og:description" content="Scan to connect with Dale Williams. Commercial Real Estate." />
  <meta property="og:url" content="https://www.squarebidness.com/mdw/dalewilliams/qr/" />

  <style>
    :root {
      --bg: #000;
      --panel: #080808;
      --line: #242427;
      --text: #f7f7f8;
      --muted: #a1a1aa;
      --accent: #cc1515;
      --accent-dim: rgba(204,21,21,.18);
      --shadow: 0 24px 80px rgba(0,0,0,.55);
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: #000;
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Inter, Arial, sans-serif;
      overflow-x: hidden;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: calc(14px + env(safe-area-inset-top)) 14px calc(14px + env(safe-area-inset-bottom));
    }

    a { color: inherit; text-decoration: none; }

    .shell {
      width: min(100%, 362px);
      max-width: calc(100vw - 28px);
      display: grid;
      gap: 14px;
    }

    .card {
      width: 100%;
      border: 1px solid var(--line);
      border-top: 3px solid var(--accent);
      border-radius: 28px;
      background:
        radial-gradient(circle at top, rgba(204,21,21,.06), transparent 32%),
        linear-gradient(180deg, #090909, #030303);
      box-shadow: var(--shadow);
      padding: 18px;
      overflow: hidden;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .brand img {
      width: 46px;
      height: 46px;
      border-radius: 14px;
      border: 1px solid var(--line);
    }

    .brand-text strong {
      display: block;
      font-size: 1.04rem;
      font-weight: 800;
      letter-spacing: -.01em;
    }

    .brand-text span {
      display: block;
      color: var(--muted);
      font-size: .84rem;
      margin-top: 1px;
    }

    .brand-text .co {
      display: block;
      color: var(--accent);
      font-size: .76rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .4px;
      margin-top: 2px;
    }

    .qr-box {
      border-radius: 22px;
      background: #fff;
      padding: 16px;
    }

    .qr-box img {
      display: block;
      width: 100%;
      height: auto;
      image-rendering: crisp-edges;
    }

    .actions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-top: 16px;
    }

    .btn {
      min-height: 50px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 0 14px;
      border: 1px solid var(--line);
      background: #0b0b0b;
      font-weight: 800;
      font-size: .94rem;
      line-height: 1.1;
      overflow-wrap: anywhere;
      transition: opacity .12s;
    }

    .btn:hover { opacity: .82; }
    .btn:active { opacity: .65; transform: scale(.97); }

    .btn.full { grid-column: 1 / -1; }

    .btn.primary {
      background: #fff;
      color: #000;
      border-color: #fff;
    }

    .btn.red {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .btn.sms {
      background: #071407;
      color: #4ade80;
      border-color: #166534;
    }

    .note {
      color: #71717a;
      text-align: center;
      font-size: .82rem;
    }

    @media (max-width: 600px) {
      body { place-items: start; }
      .shell { margin-left: 0; margin-right: auto; }
    }

    @media (max-width: 420px) {
      .card { padding: 14px; }
      .qr-box { padding: 12px; border-radius: 18px; }
      .btn { font-size: .88rem; padding: 0 10px; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="card" aria-label="Dale Williams QR connect">

      <div class="brand">
        <img src="/mdw/assets/icons/apple-touch-icon.png" alt="MDW Investments LLC" />
        <div class="brand-text">
          <strong>Dale Williams</strong>
          <span>Commercial Real Estate</span>
          <span class="co">MDW Investments LLC</span>
        </div>
      </div>

      <div class="qr-box">
        <img src="/mdw/dalewilliams/qr/assets/dale-qr.png"
             alt="QR code linking to Dale Williams connect card" />
      </div>

      <div class="actions">
        <a class="btn primary full" href="/mdw/dalewilliams/">Open Contact Card</a>
        <a class="btn sms full"
           href="sms:+13185428050?body=Hi%20Dale%2C%20I%20got%20your%20QR%20%E2%80%94%20">
          Text Dale
        </a>
        <a class="btn red" href="tel:+13185428050">Call</a>
        <a class="btn" href="/mdw/dalewilliams/dale-williams.vcf">Save Contact</a>
        <a class="btn" href="/mdw/?_source=dale_qr">MDW Hub</a>
        <a class="btn" href="/mdw/madison-square/?_source=dale_qr">Madison Sq.</a>
      </div>

    </section>

    <div class="note">Add this page to Home Screen as "MDW QR".</div>
  </main>
</body>
</html>
